name: EvidenceEngine Consumer OIDC Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-aws-identity:
    name: Verify consumer AWS identity
    runs-on: ubuntu-latest

    environment:
      name: evidence-consumer

    env:
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      EVIDENCE_ENGINE_CONSUMER_ID: ${{ vars.EVIDENCE_ENGINE_CONSUMER_ID }}
      EVIDENCE_ENGINE_EXPECTED_STREAM_ID: ${{ vars.EVIDENCE_ENGINE_EXPECTED_STREAM_ID }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Validate EvidenceEngine consumer configuration
        shell: bash
        run: |
          set -euo pipefail

          test -n "${AWS_ROLE_ARN}"
          test -n "${AWS_REGION}"
          test -n "${EVIDENCE_ENGINE_CONSUMER_ID}"
          test -n "${EVIDENCE_ENGINE_EXPECTED_STREAM_ID}"

          echo "EvidenceEngine consumer configuration is present."

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: "846470648858"
          role-session-name: EvidenceEngineConsumer-${{ github.run_id }}

      - name: Verify expected AWS role
        shell: bash
        run: |
          set -euo pipefail

          identity_arn="$(aws sts get-caller-identity \
            --query Arn \
            --output text)"

          echo "Authenticated AWS identity: $identity_arn"

          case "$identity_arn" in
            arn:aws:sts::846470648858:assumed-role/evidence-engine-consumer/*)
              echo "Consumer role assumption verified."
              ;;
            *)
              echo "Unexpected AWS identity: $identity_arn" >&2
              exit 1
              ;;
          esac